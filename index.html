<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee8fa"><title>Мой день</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#363044;background:#f5f1fc}*{box-sizing:border-box}body{margin:0}.app{max-width:560px;margin:auto;padding:20px 16px 100px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:26px;margin:0}small,.muted{color:#777084}.sub{font-size:13px;margin-top:5px}.switch{border:1px solid #ded4f2;background:white;border-radius:14px;padding:10px;font-size:14px}.limit{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:15px;padding:12px 16px;margin:16px 0;box-shadow:0 2px 12px #43315d0a}.limit strong{font-size:16px}.section{background:white;border-radius:20px;padding:16px;margin:13px 0;box-shadow:0 3px 14px #4835650a;border-left:5px solid #d6c7ed}.yellow{border-color:#efce79}.blue{border-color:#a6cbea}.mint{border-color:#9ed8c7}.lav{border-color:#c5a9e6}.peach{border-color:#e9bba9}.section h2{font-size:17px;margin:0 0 12px}.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1edf5;font-size:14px}.task:last-child{border:0}.task input{width:19px;height:19px;accent-color:#9273c6}.task.done span{text-decoration:line-through;color:#aaa}.time{font-size:12px;color:#867b95;min-width:43px}.add{margin-top:10px;border:0;background:#f1ebfb;color:#674c99;border-radius:10px;padding:10px 12px;font-weight:600}.notice{font-size:13px;color:#756a83;line-height:1.5}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e9e2f2;display:flex;justify-content:space-around;padding:12px 3px max(12px,env(safe-area-inset-bottom))}.tabs button{background:none;border:0;color:#82768f;font-size:12px;padding:5px}.tabs button.active{color:#6e4fa8;font-weight:700}.hidden{display:none}.line{padding:10px 0;border-bottom:1px solid #eee7f5;font-size:14px}.pill{background:#f0e9fa;border-radius:10px;padding:4px 8px;font-size:12px;color:#674c99}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between}.field{width:100%;border:1px solid #ddd2ed;border-radius:10px;padding:10px;font:inherit;margin:5px 0}button{cursor:pointer}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.day{margin-top:12px}.day strong{display:block;margin-bottom:6px}.grade{display:flex;gap:8px;align-items:center}.grade input{width:75px}.note{background:#faf7ff;border-radius:12px;padding:12px;font-size:13px;color:#756a83}</style></head><body><main class="app"><header><div><h1>Мой день</h1><div class="sub" id="date"></div></div><select class="switch" id="profile"><option value="child">Злата</option><option value="parent">Мама (демо)</option></select></header><div class="limit"><span>📱 Лимит телефона</span><strong id="limit">1 ч</strong></div><div id="today" class="page"></div><div id="week" class="page hidden"></div><div id="homework" class="page hidden"></div><div id="plans" class="page hidden"></div></main><nav class="tabs"><button data-page="today" class="active">Сегодня</button><button data-page="week">Неделя</button><button data-page="homework">Задания</button><button data-page="plans">Мои планы</button></nav><script>
const subjects=[['Испанский','Укр. мова','Математика','Информатика','Английский','Зар. литература'],['Укр. мова','Математика','История','Английский','Физкультура','Укр. литература'],['Английский','Испанский','Математика','Укр. мова','Физкультура','Природа'],['Английский','Математика','Укр. литература','Физкультура','Укр. мова','Труды'],['Природа','История','Математика','Искусство','ЗБД','Классный час']];const times=['08:30–09:10','09:15–09:55','10:00–10:40','10:55–11:35','11:50–12:30','12:45–13:25'];const days=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];const today=new Date(),day=today.getDay(),iso=today.toLocaleDateString('sv-SE');let state=JSON.parse(localStorage.getItem('myday_demo')||'{}');const key=(x)=>iso+':'+x;function save(){localStorage.setItem('myday_demo',JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function card(title,cls,content){return `<section class="section ${cls}"><h2>${title}</h2>${content}</section>`}function task(text,id,time=''){return `<label class="task ${state[key(id)]?'done':''}"><input type="checkbox" data-task="${esc(id)}" ${state[key(id)]?'checked':''}><span class="time">${time}</span><span>${esc(text)}</span></label>`}function extra(group){let items=state['extra:'+group]||[];return items.map((t,i)=>task(t,group+':'+i)).join('')+`<button class="add" data-add="${group}">+ Добавить пункт</button>`}function activities(d){return d===1||d===3?[['13:30','Акробатика'],['15:00','Кикбоксинг']]:d===2||d===4?[['15:00','Английский (курсы)'],['16:30','Волейбол']]:d===5?[['15:00','Кикбоксинг']]:[]}function render(){document.getElementById('date').textContent=days[day]+', '+today.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});const grades=state[key('grades')]||[];let blocked=grades.some(g=>g<=3),minutes=Math.max(0,60+grades.reduce((a,g)=>a+(g>=10?30:g>=4&&g<=7?-30:0),0));document.getElementById('limit').textContent=blocked?'Блок до конца дня':minutes>=60?Math.floor(minutes/60)+' ч'+(minutes%60?' '+minutes%60+' мин':''):minutes+' мин';let blocks=[];if(day>=1&&day<=5){let morning=['Проснуться','Позавтракать','Умыться и собраться'];blocks.push(card('☀️ Утро','yellow',morning.map((t,i)=>task(t,'morning'+i,i===0?'07:30':'')).join('')+task('Выйти в школу','leave','08:10')));let bring=['Ключи','Телефон','Школьный рюкзак'];if(day===1||day===3)bring.push('Форма для тренировок','Нунчаки','Деньги на тренировку');blocks.push(card('🎒 Взять с собой · 08:00','blue',bring.map((t,i)=>task(t,'bring'+i)).join('')+extra('bring'+day)));blocks.push(card('📚 Школа','blue',subjects[day-1].map((s,i)=>`<div class="line"><span class="time">${times[i]}</span>　${esc(s)}</div>`).join('')+`<p class="notice">Напоминания от мамы</p>`+extra('school'+day)));if(day===2||day===4||day===5){let prep=day===5?['Пообедать','Приготовить форму для тренировок','Приготовить нунчаки']:['Пообедать','Приготовить вещи на английский','Приготовить форму для волейбола'];blocks.push(card('🏠 После школы дома · 13:45','peach',prep.map((t,i)=>task(t,'after'+i)).join('')+extra('after'+day)))}blocks.push(card('🏅 Занятия','mint',activities(day).map(([time,name],i)=>task(name,'activity'+i,time)).join('')));blocks.push(card('🌙 Вечер','lav',task('Прогулка','walk','18:00')+task('Ужин','dinner','19:00')+task('Домашние задания','hw','19:30')+task('Вечерняя гигиена','hygiene')+task('Свободное время','free')+task('Отбой','sleep','22:20')))}else{blocks.push(card('🌿 Выходной','mint','<p class="notice">Свободное время. Обязательны только запланированные домашние задания и подготовка к школе на понедельник.</p>'))}let prep=['Собрать рюкзак','Приготовить одежду в школу','Приготовить резинки и расчёску','Приготовить форму на тренировку (если нужна)','Зарядить самокат','Зарядить бустер','Зарядить телефон'];blocks.push(card('🎒 Подготовка на завтра · 21:00','peach',prep.map((t,i)=>task(t,'evening'+i)).join('')+extra('evening')));document.getElementById('today').innerHTML=blocks.join('');document.getElementById('week').innerHTML=card('Расписание недели','lav',subjects.map((ss,i)=>`<div class="day"><strong>${days[i+1]}</strong>${ss.map((s,j)=>`<div class="line"><span class="time">${times[j]}</span>　${esc(s)}</div>`).join('')}<p class="notice">${activities(i+1).map(([t,s])=>t+' '+s).join(' · ')}</p></div>`).join(''));let hw=state['hw']||[];document.getElementById('homework').innerHTML=card('Домашние задания','blue','<p class="notice">Демонстрационный список. Автоматическое распределение по следующему уроку подключим на следующем этапе.</p>'+hw.map((x,i)=>task(x,'hwextra'+i)).join('')+(document.getElementById('profile').value==='parent'?'<button class="add" data-add="hw">+ Записать задание</button>':''));let plans=state['plans']||[];document.getElementById('plans').innerHTML=card('Мои планы','mint',plans.map((x,i)=>task(x,'plan'+i)).join('')+'<button class="add" data-add="plans">+ Добавить дело</button>')+(document.getElementById('profile').value==='parent'?card('Оценки · только мама','lav',`<div class="grade"><input class="field" type="number" id="grade" min="1" max="12" placeholder="1–12"><button class="add" id="addGrade">Добавить</button></div><p class="notice">Сегодня: ${grades.join(', ')||'нет оценок'}</p>`):'');}document.addEventListener('change',e=>{if(e.target.matches('[data-task]')){state[key(e.target.dataset.task)]=e.target.checked;save();render()}if(e.target.id==='profile')render()});document.addEventListener('click',e=>{const a=e.target.closest('[data-add]');if(a){let group=a.dataset.add,v=prompt('Новый пункт:');if(v&&v.trim()){let k=group==='hw'?'hw':group==='plans'?'plans':'extra:'+group;state[k]=state[k]||[];state[k].push(v.trim());save();render()}}if(e.target.id==='addGrade'){let v=Number(document.getElementById('grade').value);if(Number.isInteger(v)&&v>=1&&v<=12){state[key('grades')]=state[key('grades')]||[];state[key('grades')].push(v);save();render()}else alert('Введите оценку от 1 до 12')}let tab=e.target.closest('[data-page]');if(tab){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(tab.dataset.page).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===tab))}});render();</script></body></html>
