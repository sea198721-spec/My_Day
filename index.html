<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a579ed"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Мой день · v7</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#302642;background:#f1eaff}*{box-sizing:border-box}body{margin:0}.app{max-width:560px;margin:auto;padding:20px 16px 100px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:26px;margin:0}small,.muted{color:#777084}.sub{font-size:13px;margin-top:5px}.switch{border:1px solid #ded4f2;background:white;border-radius:14px;padding:10px;font-size:14px}.limit{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:15px;padding:12px 16px;margin:16px 0;box-shadow:0 2px 12px #43315d0a}.limit strong{font-size:16px}.section{background:white;border-radius:20px;padding:16px;margin:13px 0;box-shadow:0 3px 14px #4835650a;border-left:7px solid #b28bf2}.yellow{border-color:#ffbf3f;background:#fff9e6}.blue{border-color:#58aaf2;background:#f3faff}.mint{border-color:#37c7a0;background:#effff9}.lav{border-color:#a06be7;background:#faf4ff}.peach{border-color:#ff9b7c;background:#fff4ed}.section h2{font-size:17px;margin:0 0 12px}.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1edf5;font-size:14px}.task:last-child{border:0}.task input{width:19px;height:19px;accent-color:#8050d1}.task.done span{text-decoration:line-through;color:#aaa}.time{font-size:12px;color:#867b95;min-width:43px}.add{margin-top:10px;border:0;background:#e6d5ff;color:#593399;border-radius:10px;padding:10px 12px;font-weight:600}.notice{font-size:13px;color:#756a83;line-height:1.5}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e9e2f2;display:flex;justify-content:space-around;padding:12px 3px max(12px,env(safe-area-inset-bottom))}.tabs button{background:none;border:0;color:#82768f;font-size:12px;padding:5px}.tabs button.active{color:#6e4fa8;font-weight:700}.hidden{display:none}.line{padding:10px 0;border-bottom:1px solid #eee7f5;font-size:14px}.pill{background:#e6d5ff;border-radius:10px;padding:4px 8px;font-size:12px;color:#674c99}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between}.field{width:100%;border:1px solid #ddd2ed;border-radius:10px;padding:10px;font:inherit;margin:5px 0}button{cursor:pointer}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.day{margin-top:12px}.day strong{display:block;margin-bottom:6px}.grade{display:flex;gap:8px;align-items:center}.grade input{width:75px}.note{background:#f5edff;border-radius:12px;padding:12px;font-size:13px;color:#756a83} .lesson{padding:11px 0;border-bottom:1px solid #e9e0f5}.lesson-head{display:flex;gap:10px;align-items:center}.lesson-name{font-weight:650;flex:1}.hw-entry{margin:8px 0 0 52px;padding:10px;background:#f1e8ff;border-radius:12px;color:#51377c;font-size:13px;white-space:pre-wrap}.hw-input{display:block;width:calc(100% - 52px);margin:9px 0 0 52px;border:1px solid #cbb3f1;border-radius:10px;padding:9px;font:inherit;min-height:55px}.hw-save{margin-left:52px}.hw-date{font-size:12px;color:#775e96;margin:4px 0 0 52px}.hw-task{padding:12px 0;border-bottom:1px solid #e9e0f5}.hw-task label{display:flex;gap:10px;align-items:start}.hw-task input{width:20px;height:20px;accent-color:#8050d1}.hw-task strong{display:block}.hw-task p{white-space:pre-wrap;margin:5px 0;color:#5a4b6c}.hw-task.done{opacity:.65}.mini{border:0;background:#e6d5ff;border-radius:8px;padding:7px 10px;color:#593399;font-weight:600}.lesson .mini{margin-left:52px;margin-top:7px}.caption{font-size:12px;color:#7c6e8c}.section h2{color:#38244f}.tabs button.active{color:#7d3fc8}  .tools{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.settings{padding:12px;background:#f7efff;border-radius:12px;margin-top:10px}.settings input{width:100%;margin:5px 0;padding:10px;border:1px solid #c8b4e8;border-radius:10px}.mini.danger{background:#ffe2e3;color:#a3223c}.section{box-shadow:0 5px 18px #744db520}.tabs{box-shadow:0 -4px 20px #6d39a512} .week-day{background:#fff;border-radius:14px;padding:10px;margin:10px 0} .badge-small{display:inline-block;padding:3px 8px;background:#f0dcff;border-radius:9px;font-size:12px;margin-left:5px} .activity-green{color:#159455;font-weight:700}.personal-pink{color:#dc4c9e;font-weight:700}.pickup-blue{color:#1765cc;font-weight:800}.week-activity{padding:5px 0;font-size:14px}.reminder-note{font-size:12px;color:#1765cc;margin:4px 0 10px 53px}</style></head><body><main class="app"><header><div><h1>Мой день</h1><div class="sub" id="date"></div></div><select class="switch" id="profile"><option value="child">Злата</option><option value="parent">Мама (демо)</option></select></header><div class="limit"><span>📱 Лимит телефона</span><strong id="limit">1 ч</strong></div><div id="today" class="page"></div><div id="week" class="page hidden"></div><div id="homework" class="page hidden"></div><div id="plans" class="page hidden"></div><div id="settings" class="page hidden"></div></main><nav class="tabs"><button data-page="today" class="active">Сегодня</button><button data-page="week">Неделя</button><button data-page="homework">Домашка</button><button data-page="plans">Мои планы</button><button data-page="settings">⚙️</button></nav><script>
const subjects=[['Испанский','Укр. мова','Математика','Информатика','Английский','Зар. литература'],['Укр. мова','Математика','История','Английский','Физкультура','Укр. литература'],['Английский','Испанский','Математика','Укр. мова','Физкультура','Природа'],['Английский','Математика','Укр. литература','Физкультура','Укр. мова','Труды'],['Природа','История','Математика','Искусство','ЗБД','Классный час']];
const times=['08:30–09:10','09:15–09:55','10:00–10:40','10:55–11:35','11:50–12:30','12:45–13:25'];
const days=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const today=new Date();today.setHours(12,0,0,0);const day=today.getDay();
function dateKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function plusDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
const iso=dateKey(today);let state={};try{state=JSON.parse(localStorage.getItem('myday_demo')||'{}')}catch(e){}
state.assignments=state.assignments||{};state.moves=state.moves||{};state.course=state.course||{};
let unlocked=false;let activePage='today';
function isParent(){return document.getElementById('profile').value==='parent'&&unlocked}
function pinHash(pin){let h=2166136261;for(const c of pin){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function requestParent(){if(!state.pin){alert('Сначала настрой PIN мамы в разделе ⚙️.');document.getElementById('profile').value='child';return false}const pin=prompt('Введите PIN мамы:');if(pin===null||pinHash(pin)!==state.pin){alert('Неверный PIN');document.getElementById('profile').value='child';return false}unlocked=true;return true}

const key=x=>iso+':'+x;
function save(){localStorage.setItem('myday_demo',JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(title,cls,content){return `<section class="section ${cls}"><h2>${title}</h2>${content}</section>`}
function task(text,id,time=''){return `<label class="task ${state[key(id)]?'done':''}"><input type="checkbox" data-task="${esc(id)}" ${state[key(id)]?'checked':''}><span class="time">${time}</span><span>${esc(text)}</span></label>`}
function styledTask(text,id,time,cls){return `<label class="task ${state[key(id)]?'done':''} ${cls}"><input type="checkbox" data-task="${esc(id)}" ${state[key(id)]?'checked':''}><span class="time ${cls}">${time}</span><span>${esc(text)}</span></label>`}
function extra(group){let items=state['extra:'+group]||[];return items.map((t,i)=>task(t,group+':'+i)).join('')+`<button class="add" data-add="${group}">+ Добавить пункт</button>`}
function activities(d){return d===1||d===3?[['13:30–14:30','Акробатика'],['15:00–16:00','Кикбоксинг']]:d===2||d===4?[['15:00–16:00','Английский (курсы)'],['16:30–18:00','Волейбол']]:d===5?[['15:00–16:00','Кикбоксинг']]:[]}
function nextLesson(assigned,subject){for(let n=1;n<=8;n++){let d=plusDays(assigned,n),w=d.getDay();if(w>=1&&w<=5&&subjects[w-1].includes(subject))return d}return plusDays(assigned,7)}
function plannedDate(assigned,subject){const next=nextLesson(assigned,subject);const p=plusDays(next,-1);return p.getDay()===0?plusDays(p,-1):p}
function allHomework(){return Object.entries(state.assignments).filter(([,a])=>a&&a.text).map(([id,a])=>{let assigned=new Date(a.date+'T12:00:00');return {...a,id,planned:state.moves[id]||dateKey(plannedDate(assigned,a.subject)),next:dateKey(nextLesson(assigned,a.subject))}})}
function homeworkFor(date){return allHomework().filter(a=>!state['done:'+a.id]&&a.planned<=date).sort((a,b)=>a.planned.localeCompare(b.planned))}
function weekStart(d){const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function weeklyHomeworkCards(){
 const start=weekStart(today),items=allHomework();
 const overdue=items.filter(a=>a.planned<dateKey(start)&&!state['done:'+a.id]);
 let html=overdue.length?`<div class="day"><strong>Невыполненное с прошлых недель</strong>${overdue.map(homeworkItem).join('')}</div>`:'';
 for(let i=0;i<7;i++){
  const date=plusDays(start,i),k=dateKey(date),group=items.filter(a=>a.planned===k).sort((a,b)=>a.subject.localeCompare(b.subject,'ru'));
  html+=`<div class="day"><strong>${days[date.getDay()]} · ${date.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</strong>${(group.length?group.map(homeworkItem).join(''):'<p class="notice">Заданий пока нет</p>')+((i===2||i===6)?courseItem(k):'')}</div>`;
 }
 return html;
}
function courseItem(date){const val=state.course[date]||'';const done=!!state['courseDone:'+date];return `<div class="hw-task"><label><input type="checkbox" data-course-done="${date}" ${done?'checked':''}><div><strong>Английский — курсы</strong><p>${esc(val)||'<span class="muted">Задание ещё не записано</span>'}</p>${isParent()?`<button class="mini" data-course-edit="${date}">✎ Записать домашку</button>`:''}</div></label></div>`}
function homeworkItem(a){const done=!!state['done:'+a.id];return `<div class="hw-task"><label><input type="checkbox" data-hw-done="${esc(a.id)}" ${done?'checked':''}><div><strong>${esc(a.subject)}</strong>${done?' <span class="caption">✓ Выполнено</span>':''}<p>${esc(a.text)}</p><span class="caption">Следующий урок: ${new Date(a.next+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</span>${new Date(a.planned+'T12:00:00').getDay()===6&&!done?`<div class="tools"><button class="mini" data-move="${esc(a.id)}">На воскресенье →</button></div>`:''}</div></label></div>`}
function lessonRows(w,date,editable){return subjects[w-1].map((subject,i)=>{let id=dateKey(date)+'-'+i,record=state.assignments[id],planned=plannedDate(date,subject);return `<div class="lesson"><div class="lesson-head"><span class="time">${times[i]}</span><span class="lesson-name">${esc(subject)}</span></div>${record?.text&&editable?`<div class="hw-entry">📝 ${esc(record.text)}</div><div class="hw-date">В «Домашке»: ${planned.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</div>`:''}${editable?`<button class="mini" data-edit-hw="${esc(id)}" data-subject="${esc(subject)}" data-date="${dateKey(date)}">${record?.text?'Изменить домашку':'+ Домашка'}</button>`:''}</div>`}).join('')}
function homeworkCards(){const items=homeworkFor(iso);return items.length?items.map(a=>`<div class="hw-task"><label><input type="checkbox" data-hw-done="${esc(a.id)}"><div><strong>${esc(a.subject)}</strong><p>${esc(a.text)}</p><span class="caption">${a.planned<iso?'Не выполнено ранее · ':''}Следующий урок: ${new Date(a.next+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</span></div></label></div>`).join(''):'<p class="notice">На сегодня записанных домашних заданий нет.</p>'}
function render(){const parent=isParent();document.getElementById('date').textContent=days[day]+', '+today.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});const grades=state[key('grades')]||[];const blocked=grades.some(g=>g<=3),minutes=Math.max(0,60+grades.reduce((a,g)=>a+(g>=10?30:g>=4&&g<=7?-30:0),0));document.getElementById('limit').textContent=blocked?'Блок до конца дня':minutes>=60?Math.floor(minutes/60)+' ч'+(minutes%60?' '+minutes%60+' мин':''):minutes+' мин';let blocks=[];
if(day>=1&&day<=5){blocks.push(card('☀️ Утро','yellow',['Проснуться','Позавтракать','Умыться и собраться'].map((t,i)=>task(t,'morning'+i,i===0?'07:30':'')).join('')+task('Выйти в школу','leave','08:10')));let bring=['Ключи','Телефон','Школьный рюкзак','Бустер'];if(day===1||day===3)bring.push('Форма для тренировок','Нунчаки','Деньги на тренировку');blocks.push(card('🎒 Взять с собой · 08:00','blue',bring.map((t,i)=>task(t,'bring'+i)).join('')+extra('bring'+day)));blocks.push(card('📚 Школа','blue',lessonRows(day,today,parent)+`<p class="notice">Напоминания от мамы</p>`+extra('school'+day)));if(day===2||day===4||day===5){let prep=day===5?['Пообедать','Приготовить форму для тренировок','Приготовить нунчаки']:['Пообедать','Приготовить вещи на английский','Приготовить форму для волейбола'];blocks.push(card('🏠 После школы дома · 13:45','peach',prep.map((t,i)=>task(t,'after'+i)).join('')+extra('after'+day)))}blocks.push(card('🏅 Занятия','mint',activities(day).map(([time,name],i)=>styledTask(name,'activity'+i,time,'activity-green')).join('')+(day===2||day===4||day===5?styledTask('Личное время','personalEarly', '13:30–14:45','personal-pink'):'')+(day===1||day===3||day===5?styledTask('Личное время','personal','16:00–16:45','personal-pink')+styledTask('Забрать Макса из садика','pickupMax','16:45','pickup-blue')+'<div class="reminder-note">🔔 Напоминание в 16:35</div>':'')));blocks.push(card('🌙 Вечер','lav',task('Прогулка','walk','18:00')+task('Ужин','dinner','19:00')+task('Домашние задания','hw','19:30')+task('Порядок в комнате','roomOrder')+task('Вечерняя гигиена','hygiene')+task('Свободное время','free')+task('Отбой','sleep','22:20')))}else{blocks.push(card('🌿 Выходной','mint','<p class="notice">Свободное время. Домашка и подготовка к понедельнику — по плану.</p>'));if(day===6)blocks.push(card('🧹 Суббота · уборка','yellow',task('Уборка в комнате','roomCleaning')));blocks.push(card('🌙 Вечер','lav',task('Порядок в комнате','roomOrder')))}
blocks.push(card('📖 Домашка на сегодня','blue',homeworkCards()));let prep=['Собрать рюкзак','Приготовить одежду в школу','Приготовить резинки и расчёску','Приготовить форму на тренировку (если нужна)','Зарядить самокат','Зарядить бустер','Зарядить телефон'];if(day===0||(day>=1&&day<=4))blocks.push(card('🎒 Подготовка на завтра · 21:00','peach',prep.map((t,i)=>task(t,'evening'+i)).join('')+extra('evening')));document.getElementById('today').innerHTML=blocks.join('');
document.getElementById('week').innerHTML=card('Расписание недели','lav',subjects.map((ss,i)=>`<div class="day"><strong>${days[i+1]}</strong>${lessonRows(i+1,plusDays(today,(i+1-day+7)%7),parent)}${activities(i+1).map(([t,s])=>`<div class="week-activity activity-green">${esc(t)} ${esc(s)}</div>`).join('')}${i===0||i===2||i===4?`${i===4?'<div class="week-activity personal-pink">13:30–14:45 Личное время</div>':''}<div class="week-activity personal-pink">16:00–16:45 Личное время</div><div class="week-activity pickup-blue">16:45 Забрать Макса из садика · 🔔 16:35</div>`:'<div class="week-activity personal-pink">13:30–14:45 Личное время</div>'}</div>`).join(''));
document.getElementById('homework').innerHTML=card('Домашка · вся неделя','blue',weeklyHomeworkCards()+(parent?'<p class="notice">Чтобы записать домашнее задание, открой «Сегодня» или «Неделя» и нажми «+ Домашка» возле нужного урока.</p>':''));let plans=state['plans']||[];document.getElementById('plans').innerHTML=card('Мои планы','mint',plans.map((x,i)=>task(x,'plan'+i)).join('')+'<button class="add" data-add="plans">+ Добавить дело</button>')+(parent?card('Оценки · только мама','lav',`<div class="grade"><input class="field" type="number" id="grade" min="1" max="12" placeholder="1–12"><button class="add" id="addGrade">Добавить</button></div><p class="notice">Сегодня: ${grades.map((g,i)=>`<button class="mini" data-remove-grade="${i}">${g} ×</button>`).join(' ')||'нет оценок'}</p>`):'');renderSettings();}
function renderSettings(){const configured=!!state.pin;document.getElementById('settings').innerHTML=card('Семейные настройки','lav',`<div class="settings"><strong>Родительский PIN</strong><p class="notice">${configured?'PIN задан. Для изменения потребуется текущий PIN.':'Установи PIN из 4–8 цифр, чтобы закрыть редактирование в профиле Златы.'}</p><button class="add" id="setPin">${configured?'Сменить PIN':'Создать PIN'}</button></div><div class="settings"><strong>Напоминания</strong><p class="notice">Уведомления браузера доступны только при поддержке iOS и разрешении пользователя. Автоматическая доставка по расписанию в закрытом приложении пока не подключена.</p><button class="add" id="askNotifications">Разрешить уведомления</button><button class="mini" id="testNotification">Тест</button></div><div class="settings"><strong>Установить на iPhone</strong><p class="notice">Открой сайт в Safari → Поделиться → На экран «Домой». Для каждого iPhone отдельно.</p></div><div class="settings"><strong>Синхронизация</strong><p class="notice">Пока данные хранятся только на этом устройстве. Общий аккаунт и защищённая облачная синхронизация требуют отдельной серверной настройки.</p></div>`)}
document.addEventListener('change',e=>{if(e.target.matches('[data-task]')){state[key(e.target.dataset.task)]=e.target.checked;save();render()}if(e.target.matches('[data-hw-done]')){state['done:'+e.target.dataset.hwDone]=e.target.checked;save();render()}if(e.target.id==='profile'){if(e.target.value==='parent'&&!unlocked)requestParent();render()}if(e.target.matches('[data-course-done]')){state['courseDone:'+e.target.dataset.courseDone]=e.target.checked;save();render()}});
document.addEventListener('click',e=>{let edit=e.target.closest('[data-edit-hw]');if(edit){if(!isParent())return;let id=edit.dataset.editHw,subject=edit.dataset.subject,date=edit.dataset.date,previous=state.assignments[id]?.text||'';let value=prompt('Домашка · '+subject+'\nЗапиши задание (пустое поле удалит запись):',previous);if(value!==null){if(value.trim())state.assignments[id]={subject,date,text:value.trim()};else delete state.assignments[id];save();render()}return}const a=e.target.closest('[data-add]');if(a){let group=a.dataset.add;if(group.startsWith('school')&&!isParent()){alert('Школьные напоминания добавляет мама');return}let v=prompt('Новый пункт:');if(v&&v.trim()){let k=group==='plans'?'plans':'extra:'+group;state[k]=state[k]||[];state[k].push(v.trim());save();render()}}if(e.target.id==='addGrade'&&isParent()){let v=Number(document.getElementById('grade').value);if(Number.isInteger(v)&&v>=1&&v<=12){state[key('grades')]=state[key('grades')]||[];state[key('grades')].push(v);save();render()}else alert('Введите оценку от 1 до 12')}if(e.target.id==='setPin'){if(state.pin){let old=prompt('Текущий PIN:');if(old===null||pinHash(old)!==state.pin){alert('Неверный PIN');return}}let pin=prompt('Новый PIN: 4–8 цифр');if(pin!==null){if(!/^\d{4,8}$/.test(pin)){alert('Нужно от 4 до 8 цифр');return}state.pin=pinHash(pin);save();alert('PIN установлен');render()}return}
if(e.target.id==='askNotifications'){if(!('Notification'in window)){alert('Этот браузер не поддерживает уведомления');return}Notification.requestPermission().then(p=>alert('Разрешение: '+p));return}
if(e.target.id==='testNotification'){if('Notification'in window&&Notification.permission==='granted'){navigator.serviceWorker?.ready.then(r=>r.showNotification('Мой день',{body:'Проверка уведомлений'})).catch(()=>new Notification('Мой день',{body:'Проверка'}))}else alert('Сначала разреши уведомления');return}
let course=e.target.closest('[data-course-edit]');if(course){if(!isParent())return;const k=course.dataset.courseEdit;let v=prompt('Английский — курсы. Домашка:',state.course[k]||'');if(v!==null){state.course[k]=v.trim();save();render()}return}
let move=e.target.closest('[data-move]');if(move){let id=move.dataset.move,a=allHomework().find(x=>x.id===id);if(a){state.moves[id]=dateKey(plusDays(new Date(a.planned+'T12:00:00'),1));save();render()}return}
let rem=e.target.closest('[data-remove-grade]');if(rem&&isParent()){state[key('grades')].splice(Number(rem.dataset.removeGrade),1);save();render();return}
let tab=e.target.closest('[data-page]');if(tab){activePage=tab.dataset.page;document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(tab.dataset.page).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===tab))}});render();
const reminderTimes=[['08:00','Взять с собой'],['13:45','После школы дома'],['16:35','Забрать Макса из садика в 16:45'],['21:00','Подготовка на завтра'],['21:30','Повтор: подготовь вещи на завтра']];
function checkReminders(){const now=new Date(),d=now.getDay(),hm=now.toTimeString().slice(0,5),stamp=dateKey(now)+':'+hm;for(const [time,title] of reminderTimes){if(time!==hm)continue;if(time==='13:45'&&![2,4,5].includes(d))continue;if(time==='16:35'&&![1,3,5].includes(d))continue;if((time==='21:00'||time==='21:30')&&![0,1,2,3,4].includes(d))continue;if(time==='08:00'&&(d===0||d===6))continue;if(state['notified:'+stamp])continue;state['notified:'+stamp]=true;save();if('Notification' in window&&Notification.permission==='granted'){navigator.serviceWorker?.ready.then(r=>r.showNotification('Мой день',{body:title})).catch(()=>{})}}}
setInterval(checkReminders,30000);checkReminders();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}</script></body></html>
