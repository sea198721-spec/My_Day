function dateKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function plusDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
const iso=dateKey(today);let state={};

function nextLesson(assigned,subject){for(let n=1;n<=8;n++){let d=plusDays(assigned,n),w=d.getDay();if(w>=1&&w<=5&&subjects[w-1].includes(subject))return d}return plusDays(assigned,7)}

 }

}

function render(){if(!cloudReady)return;const parent=isParent();document.getElementById('date').textContent=days[day]+', '+today.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});const grades=state[key('grades')]||[];const blocked=grades.some(g=>g<=3),minutes=Math.max(0,60+grades.reduce((a,g)=>a+(g>=10?30:g>=4&&g<=7?-30:0),0));document.getElementById('limit').textContent=blocked?'Блок до конца дня':minutes>=60?Math.floor(minutes/60)+' ч'+(minutes%60?' '+minutes%60+' мин':''):minutes+' мин';let blocks=[];

 blocks.push(card('☀️ Утро','yellow',['Проснуться','Позавтракать','Умыться и собраться'].map((t,i)=>task(t,'morning'+i,i===0?'07:30':'')).join('')+task('Выйти в школу','leave','08:10')));

// Record each newly completed homework item for the server-side push worker.
function recordHomeworkCompletion(kind,id,subject){
  if(!cloudReady||isParent())return;
  const eventId=kind+':'+id+':'+Date.now();
  state.homeworkNotifications ||= {};
  state.homeworkNotifications[eventId]={kind,id,subject,completedAt:new Date().toISOString()};
}
document.addEventListener('change',e=>{
  if(e.target.matches('[data-task]')){state[key(e.target.dataset.task)]=e.target.checked;save();render()}
  if(e.target.matches('[data-hw-done]')){
    const id=e.target.dataset.hwDone,wasDone=!!state['done:'+id];
    state['done:'+id]=e.target.checked;
    if(e.target.checked&&!wasDone){
      const assignment=state.assignments?.[id];
      recordHomeworkCompletion('school',id,assignment?.subject||'Школьный предмет');
    }
    save();render();
  }
  if(e.target.matches('[data-course-done]')){
    const id=e.target.dataset.courseDone,wasDone=!!state['courseDone:'+id];
    state['courseDone:'+id]=e.target.checked;
    if(e.target.checked&&!wasDone)recordHomeworkCompletion('course',id,'Английский — курсы');
    save();render();
  }
});
